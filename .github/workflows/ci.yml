name: CI

on:
  push:
    branches: [main, '00048-**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.3.11
  NODE_VERSION: 24

jobs:
  check:
    name: Format, lint, typecheck, unit tests, web build, sponsor start-up
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build:web
      - name: The sponsor starts under Bun and serves
        run: bun scripts/sponsor-smoke.ts
      - name: Secret scan over the built bundle
        run: SECRET_SCAN_EXTRA_PATHS=web/dist bash scripts/secret-scan.sh

  e2e:
    # Plan L-WEB: the browser specs (offers list, the whole swap, "Swap is not available" + Bridge
    # back, the determinism warning, resume, a refund retried; layout at 1280 and 375 px with the
    # rendered contrast), against the mock ports in the page. test/e2e/.
    name: Browser specs (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
    steps:
      - name: Tools setup-bun needs
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends unzip
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run e2e
        env:
          HOME: /root
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  secret-scan:
    name: Secret scan (full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: bash scripts/secret-scan.sh
